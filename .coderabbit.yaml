# CodeRabbit configuration.
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

reviews:
  auto_review:
    # Reviewed by CodeRabbit since 2026-09-25, when Copilot stopped: its quota
    # is per requesting user, not per repository, so it ran out everywhere at
    # once. The copilot-auto-review ruleset is enforcement=disabled, not
    # deleted. Going back takes both: re-enable that ruleset AND set
    # enabled: false below, or both reviewers run on every pull request.
    #
    # CodeRabbit is advisory here, not the merge gate. Below 100 stars the
    # gate is a local /code-review pass (owner's decision, 2026-10-04),
    # because CodeRabbit rate-limits quickly.
    #
    # Measured 2026-10-03 on limpet#11 (0 stars), after the paid trial ended
    # on 2026-10-02: the review on pull request open still ran on its own;
    # the incremental review after a push did not, and a manual
    # '@coderabbitai review' answered "Review rate limited."
    enabled: true
    # 0 disables the pause entirely, which is the schema's documented sentinel
    # ("Set to 0 to disable"), not a large number chosen by hand. At the default
    # of 5, automatic review stops silently once a pull request has five
    # reviewed commits, and a poller waiting on the verdict reads that pause as
    # a timeout rather than as a stop. Measured: sepia#250 ran four rounds.
    auto_pause_after_reviewed_commits: 0

knowledge_base:
  code_guidelines:
    # Enabled by default, but pointed at nothing by default. These are the
    # files this repository already states its rules in.
    filePatterns:
      - "README.md"
      - "README.zh-TW.md"
