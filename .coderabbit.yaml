# CodeRabbit configuration.
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

reviews:
  auto_review:
    # This repository is reviewed by CodeRabbit, not GitHub Copilot.
    #
    # Switched on 2026-09-25 because Copilot stopped reviewing, not because
    # anything about this repository changed. It is still at 1 stars. On
    # NyanCogs#44 Copilot answered with:
    #
    #   Copilot was unable to review this pull request because the user who
    #   requested the review has reached their quota limit.
    #
    # That quota is per requesting user, not per repository, so it took out
    # every repository on the Copilot side of the routing table at the same
    # moment, and no setting in this file restores any of them. NyanCogs
    # moved across on 2026-09-21 for that reason; the rest follow now.
    #
    # WHAT TRIGGERS A REVIEW HERE. Measured 2026-09-25, not inherited.
    #
    # Automatic, on pull request open. Observed on tokscale-core#41 (3 stars),
    # where CodeRabbit's summary landed at 14:14:27 and the first manual
    # '@coderabbitai review' comment was posted at 14:17:44, three minutes
    # after it; and on NyanCogs #45, #46 and #47 (4-5 stars), where its first
    # comment arrived 12 to 13 seconds after the pull request opened.
    #
    # An earlier version of this comment said that under ten stars CodeRabbit's
    # OSS tier requires manual triggering and that automatic review stops when
    # an Advanced trial ends on 2026-10-02. Neither half is supported. The
    # measurements above contradict the first, and coderabbit.ai/oss states
    # "every public repository gets CodeRabbit Review free the moment you
    # install it", with no star threshold and no trial end date anywhere on
    # the page. That claim was carried forward from the previous comment
    # block without being checked; CodeRabbit itself flagged it on this pull
    # request.
    #
    # A top-level '@coderabbitai review' comment still works and is still the
    # way to re-run a review on demand. It is just not a requirement here.
    #
    # There IS a trial, and it has a date. Verified 2026-09-25 from the
    # CodeRabbit billing page (app.coderabbit.ai, Plans & products), which is
    # the only place it is visible -- nothing in this repository, in the bot's
    # comments, or on coderabbit.ai/oss shows it:
    #
    #   Plan: Advanced, monthly, on trial. 8 seats. Trial ends 02 Oct 2026.
    #   Estimated monthly cost after that: USD 720. Credits: 0.
    #
    # So the date the earlier comment named was real. What was wrong about it
    # was the reason: it tied the date to a star-count rule that does not
    # exist. The trial is an account-level plan, so its expiry lands on every
    # repository at once and has nothing to do with this one's star count.
    #
    # WATCH THIS, because it is a charge and not a cut-off. 'Usage-based
    # reviews' is Active on the same page at USD 0.25 per reviewed file, and
    # its own description is "continue reviewing after your plan's included
    # limits are reached". Reviews may therefore keep working past 02 Oct and
    # bill per file rather than stopping. coderabbit.ai/oss separately states
    # reviews are free on every public repository, which would cover this one,
    # but the interaction between that and an expired paid plan with
    # usage-based billing switched on has NOT been observed here. Check the
    # billing page after the first review in October rather than assuming
    # either outcome.
    #
    # The Copilot ruleset is set to enforcement=disabled through the API
    # rather than deleted, so two reviewers do not both run and re-enabling
    # is one field:
    #
    #   gh api repos/OWNER/NAME/rulesets            # find copilot-auto-review
    #   gh api repos/OWNER/NAME/rulesets/ID -X PUT -f enforcement=disabled
    #
    # HOW TO GO BACK TO COPILOT, if the quota is restored and that is wanted.
    #
    # Nothing here reverts on its own. Set enabled: false, re-enable the
    # ruleset with enforcement=active, and confirm on the next pull request
    # that Copilot reviews it and CodeRabbit does not.
    #
    # Everything below stays as it is either way. The path instructions and
    # code_guidelines already govern a manually triggered review today, and
    # govern an automatic one unchanged.
    enabled: true
    # 0 disables the pause entirely, which is the schema's documented sentinel
    # ("Set to 0 to disable"), not a large number chosen by hand. At the default
    # of 5, automatic review stops silently once a pull request has five
    # reviewed commits, and a poller waiting on the verdict reads that pause as
    # a timeout rather than as a stop. Measured: sepia#250 ran four rounds.
    auto_pause_after_reviewed_commits: 0

knowledge_base:
  code_guidelines:
    # Enabled by default, but pointed at nothing by default. These are the
    # files this repository already states its rules in.
    filePatterns:
      - "README.md"
      - "README.zh-TW.md"
