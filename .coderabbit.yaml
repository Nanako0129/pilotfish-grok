# CodeRabbit configuration.
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

reviews:
  auto_review:
    # This repository is reviewed by CodeRabbit, not GitHub Copilot.
    #
    # Switched on 2026-09-25 because Copilot stopped reviewing, not because
    # anything about this repository changed. It is still at 1 stars. On
    # NyanCogs#44 Copilot answered with:
    #
    #   Copilot was unable to review this pull request because the user who
    #   requested the review has reached their quota limit.
    #
    # That quota is per requesting user, not per repository, so it took out
    # every repository on the Copilot side of the routing table at the same
    # moment, and no setting in this file restores any of them. NyanCogs
    # moved across on 2026-09-21 for that reason; the rest follow now.
    #
    # WHAT ACTUALLY TRIGGERS A REVIEW HERE, which this flag alone does not say.
    #
    # Under ten stars CodeRabbit's OSS tier requires manual triggering, so
    # enabled: true produces automatic review only until the Advanced trial
    # ends on 2026-10-02, and nothing after that. A top-level
    # '@coderabbitai review' comment works in both periods, so post it on any
    # pull request rather than checking the date.
    #
    # The flag is left true anyway. false would additionally suppress the
    # automatic review that does still work today, and would have to be
    # turned back on the moment the star count crosses ten.
    #
    # The Copilot ruleset is set to enforcement=disabled through the API
    # rather than deleted, so two reviewers do not both run and re-enabling
    # is one field:
    #
    #   gh api repos/OWNER/NAME/rulesets            # find copilot-auto-review
    #   gh api repos/OWNER/NAME/rulesets/ID -X PUT -f enforcement=disabled
    #
    # HOW TO GO BACK TO COPILOT, if the quota is restored and that is wanted.
    #
    # Nothing here reverts on its own. Set enabled: false, re-enable the
    # ruleset with enforcement=active, and confirm on the next pull request
    # that Copilot reviews it and CodeRabbit does not.
    #
    # Everything below stays as it is either way. The path instructions and
    # code_guidelines already govern a manually triggered review today, and
    # govern an automatic one unchanged.
    enabled: true
    # 0 disables the pause entirely, which is the schema's documented sentinel
    # ("Set to 0 to disable"), not a large number chosen by hand. At the default
    # of 5, automatic review stops silently once a pull request has five
    # reviewed commits, and a poller waiting on the verdict reads that pause as
    # a timeout rather than as a stop. Measured: sepia#250 ran four rounds.
    auto_pause_after_reviewed_commits: 0

knowledge_base:
  code_guidelines:
    # Enabled by default, but pointed at nothing by default. These are the
    # files this repository already states its rules in.
    filePatterns:
      - "README.md"
      - "README.zh-TW.md"
